<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Velclaw · Workspace</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="app">

  <!-- ===== FILES PANEL ===== -->
  <section class="panel active" id="panel-files">
    <div class="files-topbar">
      <button class="icon-btn" id="openDrawerBtn" aria-label="Mở cây thư mục">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></svg>
      </button>
      <span class="file-title" id="fileTitle">Chưa chọn file</span>
      <button class="save-btn" id="saveBtn" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
        Lưu
      </button>
    </div>

    <textarea id="codeArea" spellcheck="false" placeholder="Chọn một file từ cây thư mục để bắt đầu chỉnh sửa"></textarea>

    <div class="drawer-overlay" id="drawerOverlay">
      <div class="drawer">
        <div class="drawer-header">
          <span>velclaw-eve</span>
          <button class="icon-btn" id="closeDrawerBtn" aria-label="Đóng">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
        <ul class="tree" id="fileTree"></ul>
      </div>
      <button class="drawer-backdrop" id="drawerBackdrop" aria-label="Đóng nền"></button>
    </div>
  </section>

  <!-- ===== CHAT PANEL ===== -->
  <section class="panel" id="panel-chat">
    <div class="chat-header">
      <span class="title">Test agent</span>
      <span class="status">● online</span>
    </div>

    <div class="chat-messages" id="chatMessages"></div>

    <div class="chat-input-bar">
      <textarea id="chatInput" rows="1" placeholder="Nhắn cho agent…"></textarea>
      <button class="send-btn" id="sendBtn" disabled aria-label="Gửi">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
      </button>
    </div>
  </section>

  <!-- ===== DASHBOARD PANEL ===== -->
  <section class="panel" id="panel-dashboard">
    <div class="dashboard">

      <div class="status-highlight">
        <p class="label">Trạng thái deploy</p>
        <p class="value" id="deployStatus"></p>
      </div>

      <div class="card">
        <div class="card-header">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m14.7 6.3-1.4 1.4a2 2 0 0 0 0 2.8l.2.2a2 2 0 0 0 2.8 0l1.4-1.4a4 4 0 1 1-3-3Z"/><path d="m2 22 4.5-4.5"/></svg>
          <span>Tools</span>
        </div>
        <div id="toolsList"></div>
      </div>

      <div class="card">
        <div class="card-header">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22c4.4-4 8-7.4 8-11.5A8 8 0 0 0 4 10.5C4 14.6 7.6 18 12 22Z"/></svg>
          <span>Connections</span>
        </div>
        <div id="connectionsList"></div>
      </div>

      <div class="card">
        <div class="card-header">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
          <span>Cấu hình</span>
        </div>
        <div class="config-row">
          <span class="config-label">Model</span>
          <select id="modelSelect"></select>
        </div>
        <button class="link-row" id="editInstructionsBtn">
          Sửa agent/instructions.md
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
      </div>

      <div class="card">
        <div class="card-header">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M9 3v4h6V3"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="8" y1="16" x2="16" y2="16"/></svg>
          <span>Logs gần đây</span>
        </div>
        <div id="logsList"></div>
      </div>

    </div>
  </section>

  <!-- ===== BOTTOM NAV ===== -->
  <nav class="bottom-nav">
    <button class="nav-btn active" data-tab="files">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h5l2 2h9v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z"/></svg>
      <span class="nav-label">Files</span>
    </button>
    <button class="nav-btn" data-tab="chat">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      <span class="nav-label">Chat</span>
    </button>
    <button class="nav-btn" data-tab="dashboard">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
      <span class="nav-label">Dashboard</span>
    </button>
  </nav>

</div>

<script src="app.js"></script>
</body>
</html>
